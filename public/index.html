<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escapped</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- شاشة التحقق الأمنية -->
    <div id="security-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl w-96 text-center">
            <div class="text-indigo-500 text-4xl mb-4"><i class="fa-solid fa-lock"></i></div>
            <h2 class="text-xl font-bold mb-2">منطقة محمية</h2>
            <p class="text-slate-400 text-sm mb-6">الرجاء إدخال رمز المرور (1010)</p>
            <input type="password" id="pin-input" maxlength="4" class="w-full bg-slate-800 border border-slate-700 text-center text-2xl tracking-widest rounded-xl py-3 mb-4 text-white focus:outline-none focus:border-indigo-500" placeholder="••••">
            <p id="error-msg" class="text-rose-500 text-xs mb-4 hidden">رمز المرور غير صحيح!</p>
            <button onclick="verifyPin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all">دخول</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-container" class="flex-1 flex hidden">
        <!-- القائمة الجانبية -->
        <aside class="w-64 bg-slate-950 border-l border-slate-800 flex flex-col justify-between p-4">
            <div>
                <div class="flex items-center justify-between mb-8 px-2">
                    <h1 class="text-xl font-black text-indigo-400">Escapped</h1>
                    <span class="flex h-3 w-3 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                </div>
                <nav class="space-y-2">
                    <button onclick="switchTab('youtube')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium"><i class="fa-brands fa-youtube text-rose-500"></i> يوتيوب</button>
                    <button onclick="switchTab('tiktok')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium"><i class="fa-brands fa-tiktok text-cyan-400"></i> تيك توك</button>
                    <button onclick="switchTab('matches')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium"><i class="fa-solid fa-futbol text-emerald-500"></i> المباريات</button>
                    <button onclick="switchTab('chat')" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-comments text-amber-500"></i> الشات</span>
                    </button>
                </nav>
            </div>
            
            <div class="border-t border-slate-800/60 pt-4 space-y-3">
                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                    <span>المستخدم:</span>
                    <button onclick="changeUsername()" id="current-username-display" class="text-indigo-400 font-bold hover:underline">User_YHCW</button>
                </div>
                <div class="text-xs text-slate-500 text-center bg-slate-900 py-2 rounded-lg border border-slate-800">
                    المتصلين الآن (<span id="online-count-display">0</span>)
                </div>
            </div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 p-8 overflow-y-auto">
            <!-- قسم اليوتيوب مع خانة إضافة الرابط -->
            <div id="tab-youtube" class="tab-content">
                <h2 class="text-2xl font-bold mb-6">محتوى اليوتيوب</h2>
                <div class="mb-6 flex gap-2">
                    <input type="text" id="yt-link-input" placeholder="أدخل رابط فيديو يوتيوب هنا..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="addYoutubeLink()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium">إضافة</button>
                </div>
                <div id="youtube-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- قسم تيك توك مع خانة إضافة الرابط -->
            <div id="tab-tiktok" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-6">محتوى تيك توك</h2>
                <div class="mb-6 flex gap-2">
                    <input type="text" id="tt-link-input" placeholder="أدخل معرف أو رابط تيك توك هنا..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="loadTikTokFeed()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium">بحث / جلب</button>
                </div>
                <div id="tiktok-feed" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

            <!-- قسم المباريات -->
            <div id="tab-matches" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-6">جدول المباريات (Betfair & Diamond)</h2>
                <div id="matches-feed" class="space-y-4">
                    <p class="text-slate-500">جاري تحميل المباريات...</p>
                </div>
            </div>

            <!-- قسم الشات -->
            <div id="tab-chat" class="tab-content hidden h-[calc(100vh-8rem)] flex flex-col bg-slate-950 rounded-2xl border border-slate-800">
                <div class="p-4 border-b border-slate-800 font-bold">غرفة المحادثة المباشرة</div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                <div class="p-4 border-t border-slate-800 flex gap-2">
                    <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatKeyPress(event)">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium transition-all">إرسال</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const socket = io();

        let username = localStorage.getItem('escapped_username') || 'User_YHCW';
        document.getElementById('current-username-display').innerText = username;

        function changeUsername() {
            const newName = prompt("تغيير اسم المستخدم:", username);
            if (newName && newName.trim()) {
                username = newName.trim();
                localStorage.setItem('escapped_username', username);
                document.getElementById('current-username-display').innerText = username;
            }
        }

        // وضع الشاشة البيضاء عند الضغط على A 5 مرات
        let aPressCount = 0;
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'a') {
                aPressCount++;
                if (aPressCount >= 5) {
                    document.body.style.backgroundColor = '#ffffff';
                    document.body.innerHTML = '';
                }
            } else {
                aPressCount = 0;
            }
        });

        function verifyPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === "1010") {
                document.getElementById('security-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                loadMatches();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-slate-800', 'text-white'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('bg-slate-800', 'text-white');
            }
        }

        // يوتيوب
        function addYoutubeLink() {
            const input = document.getElementById('yt-link-input');
            const url = input.value.trim();
            if(!url) return;
            const container = document.getElementById('youtube-feed');
            const div = document.createElement('div');
            div.className = "bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm break-all";
            div.innerHTML = `<p class="text-indigo-400 font-bold mb-2">رابط يوتيوب:</p><a href="${url}" target="_blank" class="text-slate-300 underline">${url}</a>`;
            container.appendChild(div);
            input.value = '';
        }

        // تيك توك
        function loadTikTokFeed() {
            const container = document.getElementById('tiktok-feed');
            container.innerHTML = '<p class="text-slate-500">جاري البحث في تيك توك...</p>';
            fetch('/api/tiktok')
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = '<p class="text-slate-400">تم جلب بيانات تيك توك بنجاح.</p>';
                })
                .catch(() => {
                    container.innerHTML = '<p class="text-rose-500">تعذر جلب بيانات تيك توك حالياً.</p>';
                });
        }

        // المباريات
        function loadMatches() {
            const container = document.getElementById('matches-feed');
            fetch('/api/matches')
                .then(res => res.json())
                .then(data => {
                    if(Array.isArray(data) && data.length > 0) {
                        container.innerHTML = data.map(m => `<div class="bg-slate-950 p-4 rounded-xl border border-slate-800">مباراة / بطولة ID: ${JSON.stringify(m)}</div>`).join('');
                    } else {
                        container.innerHTML = '<div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-emerald-400">سيرفر المباريات متصل وجاهز للبيانات عبر Betfair & Diamond API.</div>';
                    }
                })
                .catch(() => {
                    container.innerHTML = '<div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-400">جاري استقبال بيانات الرياضة والمباريات...</div>';
                });
        }

        // عداد المتصلين
        socket.on('online-count', (count) => {
            const el = document.getElementById('online-count-display');
            if (el) el.innerText = count;
        });

        // الشات
        socket.on('chat-message', (data) => {
            appendMessage(data.user || 'User_YHCW', data.text || '');
        });

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            socket.emit('chat-message', { user: username, text: text });
            input.value = '';
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function appendMessage(user, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = "bg-slate-900 p-3 rounded-xl border border-slate-800/60";
            div.innerHTML = `<span class="text-indigo-400 font-bold text-sm ml-2">${user}:</span><span class="text-slate-200 text-sm">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
