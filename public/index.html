<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: flex; }

        .chat-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 5px;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .chat-mine { background-color: #3b82f6; border-bottom-left-radius: 2px; align-self: flex-end; }
        .chat-other { background-color: #1e293b; border-bottom-right-radius: 2px; align-self: flex-start; }
        .ping-highlight { background-color: #ef4444 !important; }

        .tiktok-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }
        .tiktok-video-wrapper {
            scroll-snap-align: start;
            height: 100%;
            min-height: 100%;
            width: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tiktok-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .video-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; background: rgba(0,0,0,.75); }
        .video-loading.hidden { display: none; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .spinner {
            width: 38px; height: 38px;
            border: 4px solid #334155;
            border-top-color: #d946ef;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="flex h-screen w-screen overflow-hidden">

    <!-- شاشة الحماية والتحقق -->
    <div id="security-screen" class="fixed inset-0 bg-white z-[99999] flex flex-col items-center justify-center text-slate-900 transition-opacity duration-300">
        <div id="step-1-msg" class="text-2xl font-bold mb-4 text-center px-4">
            أهلاً بك. يرجى الضغط على زر <span class="text-blue-600 font-black">A</span> في الكيبورد <span id="counter-display" class="text-red-500 font-black">5</span> مرات للمتابعة.
        </div>
        
        <div id="step-2-box" class="hidden flex-col items-center gap-4 w-80">
            <p class="text-lg font-bold">أدخل كلمة المرور:</p>
            <input type="password" id="password-input" placeholder="••••" class="w-full bg-slate-100 border border-slate-300 p-3 rounded-xl text-center text-xl tracking-widest focus:outline-none focus:border-blue-500" maxlength="4">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">دخول</button>
            <p id="error-msg" class="text-red-500 text-sm hidden">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->
    <aside class="w-64 bg-slate-900 border-l border-slate-800 flex flex-col z-20 shrink-0">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-fuchsia-500">Escapped</h1>
            <span class="text-xs text-green-400">متصل بالسيرفر</span>
        </div>

        <nav class="flex-1 py-4 px-4 space-y-2 overflow-y-auto">
            <button onclick="switchTab('youtube')" class="nav-btn w-full flex items-center gap-4 px-4 py-3 bg-blue-600 rounded-xl text-white">
                <i class="fab fa-youtube"></i> يوتيوب
            </button>
            <button onclick="switchTab('tiktok'); loadTikTokFeed();" class="nav-btn w-full flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl">
                <i class="fab fa-tiktok"></i> تيك توك
            </button>
            <button onclick="switchTab('football'); loadMatches('server1');" class="nav-btn w-full flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl">
                <i class="fas fa-futbol"></i> المباريات
            </button>
            <button onclick="switchTab('chat')" class="nav-btn w-full flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl relative">
                <i class="fas fa-comments"></i> الشات
                <span id="chat-badge" class="absolute top-2 right-2 bg-red-500 text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">!</span>
            </button>
        </nav>
    </aside>

    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->
    <main class="flex-1 bg-slate-950 relative h-full w-full overflow-hidden">

        <!-- ================================================= -->
        <!-- YOUTUBE -->
        <!-- ================================================= -->
        <div id="tab-youtube" class="tab-content active w-full h-full p-8 flex-col overflow-y-auto">
            <h2 class="text-3xl font-black mb-6">يوتيوب المطور</h2>

            <!-- حقل البحث أو الرابط -->
            <div class="flex gap-2 mb-6 shrink-0">
                <input type="text" id="yt-input" placeholder="ابحث هنا أو ضع رابط يوتيوب..." class="flex-1 bg-slate-900 border border-slate-700 p-4 rounded-xl focus:outline-none" dir="auto">
                <button onclick="handleYouTubeInput()" class="bg-gradient-to-r from-red-600 to-pink-600 px-8 rounded-xl font-bold hover:opacity-90 transition">
                    <i class="fas fa-search"></i> بحث / تشغيل
                </button>
            </div>

            <!-- مشغل الفيديو -->
            <div id="yt-player-container" class="w-full h-96 bg-black rounded-xl border border-slate-800 overflow-hidden relative flex items-center justify-center mb-6 hidden">
                <video id="yt-video-player" controls playsinline preload="metadata" class="w-full h-full absolute inset-0 object-contain"></video>
                <div id="yt-loading" class="video-loading hidden">
                    <div class="flex flex-col items-center gap-4">
                        <div class="spinner"></div>
                        <span>جاري تحميل الفيديو...</span>
                    </div>
                </div>
            </div>

            <!-- شبكة نتائج البحث -->
            <div id="yt-search-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div id="yt-placeholder" class="col-span-full text-slate-500 text-center py-10">
                    ابحث عن مقطع أو ضع الرابط لتشغيله.
                </div>
            </div>
        </div>

        <!-- ================================================= -->
        <!-- TIKTOK -->
        <!-- ================================================= -->
        <div id="tab-tiktok" class="tab-content w-full h-full flex-col items-center py-4">
            <div class="w-full max-w-md flex gap-2 mb-4 shrink-0 px-4">
                <input type="text" id="tk-search-input" placeholder="ابحث في تيك توك..." class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl focus:outline-none text-sm" dir="auto">
                <button onclick="searchTikTok()" class="bg-gradient-to-r from-fuchsia-600 to-purple-600 px-4 rounded-xl font-bold text-sm hover:opacity-90">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div id="tk-feed" class="tiktok-container flex-1 w-full max-w-md border-2 border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative">
                <div class="absolute inset-0 flex items-center justify-center text-slate-500 z-0">
                    جاري تحميل المقاطع...
                </div>
            </div>
        </div>

        <!-- ================================================= -->
        <!-- FOOTBALL -->
        <!-- ================================================= -->
        <div id="tab-football" class="tab-content w-full h-full p-8 flex-col overflow-y-auto">
            <h2 class="text-3xl font-black mb-4">بث المباريات المباشرة</h2>
            <div class="flex gap-3 mb-6 shrink-0">
                <button onclick="loadMatches('server1')" class="bg-blue-600 px-6 py-2 rounded-lg font-bold text-sm" id="btn-srv1">سيرفر 1</button>
                <button onclick="loadMatches('server2')" class="bg-slate-800 px-6 py-2 rounded-lg font-bold text-sm" id="btn-srv2">سيرفر 2</button>
            </div>
            <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10"></div>
        </div>

        <!-- ================================================= -->
        <!-- CHAT -->
        <!-- ================================================= -->
        <div id="tab-chat" class="tab-content w-full h-full">
            <div class="flex h-full w-full">
                <div class="flex-1 flex flex-col h-full border-l border-slate-800">
                    <div class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center shrink-0">
                        <h3 class="font-bold">الغرفة العامة</h3>
                        <div class="flex gap-2">
                            <input type="text" id="username-input" value="User" class="bg-slate-800 px-3 py-1 rounded text-sm w-32 text-center text-pink-400 font-bold">
                            <button onclick="updateName()" class="bg-blue-600 px-3 py-1 rounded text-sm">حفظ اسمي</button>
                        </div>
                    </div>
                    <div id="chat-box" class="flex-1 p-6 overflow-y-auto bg-slate-950 flex flex-col gap-2"></div>
                    <div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2 shrink-0">
                        <input type="text" id="chat-input" placeholder="اكتب رسالة... (استخدم @ لعمل منشن)" class="flex-1 bg-slate-800 rounded-xl px-4 py-3 focus:outline-none" onkeypress="if(event.key === 'Enter') sendMsg()">
                        <button onclick="sendMsg()" class="bg-blue-600 px-6 py-3 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
                <div class="w-64 bg-slate-900 p-4 shrink-0 overflow-y-auto">
                    <h3 class="font-bold text-slate-400 mb-4 border-b border-slate-800 pb-2">المتصلين الآن (<span id="online-count">0</span>)</h3>
                    <ul id="online-users-list" class="space-y-2"></ul>
                </div>
            </div>
        </div>

    </main>

    <!-- STREAM MODAL -->
    <div id="stream-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-8">
        <button onclick="closeStream()" class="absolute top-8 right-8 bg-red-600 w-10 h-10 rounded-full flex items-center justify-center">
            <i class="fas fa-times"></i>
        </button>
        <video id="hls-video" controls playsinline class="w-full max-w-4xl rounded-xl border border-slate-700 aspect-video bg-black"></video>
    </div>

    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
let currentYouTubeFile = null;
let currentTikTokFile = null;
let currentTikTokElement = null;
let tkLoaded = false;
let hlsInstance = null;

// ======================================================
// SECURITY LOCK LOGIC
// ======================================================
let pressCount = 0;
const targetPresses = 5;
let isUnlocked = false;

document.addEventListener('keydown', async (event) => {
    // زر الطوارئ ESC (يغلق الموقع أو يعيد توجيهه لصفحة فارغة/جوجل فوراً)
    if (event.key === 'Escape') {
        await stopYouTubeVideo();
        await stopCurrentTikTok();
        closeStream();
        // إغلاق نافذة المتصفح أو الخروج الطارئ
        window.location.href = "about:blank";
        return;
    }

    // منطق حماية الشاشة البيضاء (الضغط على زر a خمس مرات)
    if (!isUnlocked && (event.key === 'a' || event.key === 'A' || event.key === 'ش')) { // يدعم حرف A والانجليزي والعربي للاحتياط
        pressCount++;
        let remaining = targetPresses - pressCount;
        
        if (remaining > 0) {
            document.getElementById('counter-display').innerText = remaining;
        } else {
            // إخفاء رسالة العد وإظهار إدخال الباسورد
            document.getElementById('step-1-msg').classList.add('hidden');
            document.getElementById('step-2-box').classList.remove('hidden');
            document.getElementById('step-2-box').classList.add('flex');
            document.getElementById('password-input').focus();
        }
    }
});

function checkPassword() {
    const pass = document.getElementById('password-input').value;
    if (pass === '1010') {
        isUnlocked = true;
        const securityScreen = document.getElementById('security-screen');
        securityScreen.classList.add('opacity-0');
        setTimeout(() => {
            securityScreen.remove();
        }, 300);
    } else {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.classList.remove('hidden');
        document.getElementById('password-input').value = '';
    }
}

// ======================================================
// TAB SWITCH
// ======================================================
function switchTab(tabId) {
    if (tabId !== 'youtube') stopYouTubeVideo();
    if (tabId !== 'tiktok') stopCurrentTikTok();

    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`)?.classList.add('active');

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-slate-400');
    });

    const buttons = document.querySelectorAll('.nav-btn');
    const index = { youtube: 0, tiktok: 1, football: 2, chat: 3 }[tabId];
    if (index !== undefined && buttons[index]) {
        buttons[index].classList.add('bg-blue-600', 'text-white');
        buttons[index].classList.remove('text-slate-400');
    }

    if (tabId === 'chat') document.getElementById('chat-badge').classList.add('hidden');
}

// ======================================================
// CHAT
// ======================================================
const socket = io();
let myName = document.getElementById('username-input').value;

socket.on('connect', () => socket.emit('user_join', myName));

function updateName() {
    myName = document.getElementById('username-input').value.trim();
    if (!myName) {
        myName = 'USER';
        document.getElementById('username-input').value = myName;
    }
    socket.emit('user_join', myName);
}

function sendMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (text) {
        socket.emit('send_message', { text });
        input.value = '';
    }
}

socket.on('receive_message', (msg) => {
    const box = document.getElementById('chat-box');
    const isMe = msg.user === myName;
    const isPinged = msg.text.includes(`@${myName}`);

    box.innerHTML += `
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
            <span class="text-[10px] text-slate-500 mb-1 px-1">${escapeHtml(msg.user)} - ${escapeHtml(msg.timestamp)}</span>
            <div class="chat-bubble ${isMe ? 'chat-mine' : 'chat-other'} ${isPinged ? 'ping-highlight' : ''}">
                ${escapeHtml(msg.text)}
            </div>
        </div>
    `;
    box.scrollTop = box.scrollHeight;

    if (!document.getElementById('tab-chat').classList.contains('active')) {
        document.getElementById('chat-badge').classList.remove('hidden');
    }
});

socket.on('ping_notification', () => document.getElementById('ping-sound').play().catch(() => {}));

socket.on('update_users', (users) => {
    document.getElementById('online-count').innerText = users.length;
    document.getElementById('online-users-list').innerHTML = users.map(u => `
        <li class="flex items-center gap-2 p-2 bg-slate-800 rounded-lg text-sm cursor-pointer hover:bg-slate-700" onclick="insertPing('${escapeHtml(u)}')">
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
            ${escapeHtml(u)} ${u === myName ? '(أنت)' : ''}
        </li>
    `).join('');
});

function insertPing(user) {
    if (user !== myName) {
        const input = document.getElementById('chat-input');
        input.value += `@${user} `;
        input.focus();
    }
}

function escapeHtml(value) {
    return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

// ======================================================
// YOUTUBE LOGIC
// ======================================================
async function handleYouTubeInput() {
    const input = document.getElementById('yt-input').value.trim();
    if (!input) return alert('أدخل نصاً للبحث أو رابطاً');

    if (input.startsWith('http') || input.includes('youtube.com') || input.includes('youtu.be')) {
        playYouTubeVideo(input);
    } else {
        searchYouTube(input);
    }
}

async function searchYouTube(query) {
    const resultsContainer = document.getElementById('yt-search-results');
    resultsContainer.innerHTML = '<div class="col-span-full flex justify-center py-10"><div class="spinner"></div></div>';
    document.getElementById('yt-player-container').classList.add('hidden');

    try {
        const response = await fetch(`/api/youtube/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        const videos = data.videos || data.items || data.data;

        if (!videos || videos.length === 0) throw new Error("لا توجد نتائج");

        resultsContainer.innerHTML = videos.map(vid => `
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer hover:border-pink-500 transition group" onclick="playYouTubeVideo('https://youtube.com/watch?v=${vid.video_id || vid.id}')">
                <div class="relative aspect-video">
                    <img src="${vid.thumbnails?.[0]?.url || vid.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-play text-white text-3xl"></i>
                    </div>
                </div>
                <div class="p-3 text-sm font-bold truncate">${escapeHtml(vid.title)}</div>
            </div>
        `).join('');
    } catch (err) {
        resultsContainer.innerHTML = `<div class="col-span-full text-red-500 text-center py-10">حدث خطأ أو لا توجد نتائج.</div>`;
    }
}

async function playYouTubeVideo(urlOrId) {
    await stopYouTubeVideo();
    
    document.getElementById('yt-search-results').innerHTML = '';
    const container = document.getElementById('yt-player-container');
    const video = document.getElementById('yt-video-player');
    const loading = document.getElementById('yt-loading');

    container.classList.remove('hidden');
    loading.classList.remove('hidden');
    video.classList.add('hidden');

    try {
        const response = await fetch(`/api/youtube/play?url=${encodeURIComponent(urlOrId)}`);
        const data = await response.json();

        if (!response.ok || !data.success) throw new Error(data.error || 'تعذر تحميل الفيديو');

        currentYouTubeFile = data.file;
        video.src = data.url;
        video.load();

        video.onloadeddata = () => {
            loading.classList.add('hidden');
            video.classList.remove('hidden');
            video.play().catch(() => {});
        };

        video.onerror = () => {
            loading.classList.add('hidden');
            alert('تعذر تشغيل الفيديو');
        };
        video.onended = stopYouTubeVideo;
    } catch (error) {
        loading.classList.add('hidden');
        alert(error.message);
    }
}

async function stopYouTubeVideo() {
    const video = document.getElementById('yt-video-player');
    if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
    if (!currentYouTubeFile) return;

    const file = currentYouTubeFile;
    currentYouTubeFile = null;
    try { await fetch(`/api/media/${encodeURIComponent(file)}`, { method: 'DELETE' }); } catch (e) {}
}

// ======================================================
// TIKTOK LOGIC
// ======================================================
async function loadTikTokFeed() {
    if (tkLoaded) return;
    renderTikTokLoader();
    try {
        const response = await fetch('/api/tiktok/feed');
        const videos = await response.json();
        buildTikTokUI(videos);
        tkLoaded = true;
    } catch (err) {
        document.getElementById('tk-feed').innerHTML = `<div class="h-full flex items-center justify-center p-10 text-red-500 text-center">تعذر جلب المقاطع.</div>`;
    }
}

async function searchTikTok() {
    const query = document.getElementById('tk-search-input').value.trim();
    if (!query) return;

    await stopCurrentTikTok();
    renderTikTokLoader();

    try {
        const response = await fetch('/api/tiktok/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
        });
        const videos = await response.json();
        if (!videos || videos.length === 0) throw new Error();
        
        buildTikTokUI(videos);
    } catch (err) {
        document.getElementById('tk-feed').innerHTML = `<div class="h-full flex items-center justify-center p-10 text-red-500 text-center">لم يتم العثور على نتائج.</div>`;
    }
}

function renderTikTokLoader() {
    document.getElementById('tk-feed').innerHTML = `
        <div class="absolute inset-0 flex items-center justify-center z-30 bg-slate-950">
            <div class="flex flex-col items-center gap-4"><div class="spinner"></div><span>جاري التحميل...</span></div>
        </div>`;
}

function buildTikTokUI(videos) {
    const container = document.getElementById('tk-feed');
    container.innerHTML = videos.map((v, index) => `
        <div class="tiktok-video-wrapper" data-index="${index}" data-source="${escapeHtml(v.play)}">
            <div class="video-loading hidden"><div class="flex flex-col items-center gap-4"><div class="spinner"></div></div></div>
            ${v.cover ? `<img src="${v.cover}" class="absolute inset-0 w-full h-full object-cover opacity-50 z-0">` : ''}
            <video class="tiktok-video z-10" controls loop playsinline preload="none"></video>
            <p class="absolute bottom-4 left-4 z-20 bg-black/60 p-2 rounded text-xs max-w-[80%] truncate">${escapeHtml(v.title)}</p>
        </div>
    `).join('');
    setupTikTokObserver();
}

function setupTikTokObserver() {
    const container = document.getElementById('tk-feed');
    const wrappers = container.querySelectorAll('.tiktok-video-wrapper');
    const observer = new IntersectionObserver(async (entries) => {
        for (const entry of entries) {
            const wrapper = entry.target;
            const video = wrapper.querySelector('video');
            if (entry.isIntersecting && entry.intersectionRatio >= 0.7) {
                await activateTikTokVideo(wrapper, video);
            } else {
                await deactivateTikTokVideo(wrapper, video);
            }
        }
    }, { root: container, threshold: [0, 0.7, 1] });
    wrappers.forEach(w => observer.observe(w));
}

async function activateTikTokVideo(wrapper, video) {
    if (currentTikTokElement === video && currentTikTokFile) { video.play().catch(()=>{}); return; }
    await stopCurrentTikTok();

    const source = wrapper.dataset.source;
    if (!source) return;

    const loading = wrapper.querySelector('.video-loading');
    if (loading) loading.classList.remove('hidden');

    try {
        const response = await fetch(`/api/tiktok/download?url=${encodeURIComponent(source)}`);
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error();

        const isStillVisible = wrapper.getBoundingClientRect().top >= -wrapper.clientHeight * 0.3 && wrapper.getBoundingClientRect().top <= wrapper.clientHeight * 0.3;
        if (!isStillVisible) { await deleteMediaFile(data.file); if(loading) loading.classList.add('hidden'); return; }

        currentTikTokFile = data.file;
        currentTikTokElement = video;
        video.src = data.url;
        video.load();
        
        video.onloadeddata = () => { if (loading) loading.classList.add('hidden'); video.play().catch(()=>{}); };
        video.onerror = async () => { if (loading) loading.classList.add('hidden'); await stopCurrentTikTok(); };
    } catch (err) {
        if (loading) loading.classList.add('hidden');
    }
}

async function deactivateTikTokVideo(wrapper, video) {
    if (currentTikTokElement === video) {
        await stopCurrentTikTok();
    }
}

async function stopCurrentTikTok() {
    const video = currentTikTokElement;
    const file = currentTikTokFile;
    currentTikTokElement = null;
    currentTikTokFile = null;

    if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
    if (file) await deleteMediaFile(file);
}

async function deleteMediaFile(file) {
    if (!file) return;
    try { await fetch(`/api/media/${encodeURIComponent(file)}`, { method: 'DELETE' }); } catch (e) {}
}

// ======================================================
// FOOTBALL & STREAM
// ======================================================
async function loadMatches(serverName) {
    const container = document.getElementById('matches-container');
    container.innerHTML = `<div class="col-span-3 text-center text-blue-500 py-10">جاري التحميل...</div>`;
    document.getElementById('btn-srv1').className = serverName === 'server1' ? 'bg-blue-600 px-6 py-2 rounded-lg font-bold text-sm' : 'bg-slate-800 px-6 py-2 rounded-lg font-bold text-sm';
    document.getElementById('btn-srv2').className = serverName === 'server2' ? 'bg-blue-600 px-6 py-2 rounded-lg font-bold text-sm' : 'bg-slate-800 px-6 py-2 rounded-lg font-bold text-sm';

    try {
        const response = await fetch(`/api/football/${serverName}`);
        const data = await response.json();
        const matches = data.result || data.data || data;

        if (Array.isArray(matches) && matches.length > 0) {
            container.innerHTML = matches.map(m => {
                const score = m.score || m.result || '- : -';
                const isLive = m.status === 'LIVE';
                const statusClass = isLive ? 'text-red-500 font-bold animate-pulse' : 'text-slate-400';
                const statusText = isLive ? '🔴 مباشر' : 'منتهية / لم تبدأ';
                const streamUrl = m.url || m.stream_url || '';

                return `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl cursor-pointer hover:bg-slate-800 transition flex flex-col justify-between" onclick="openStream('${escapeHtml(streamUrl)}')">
                        <div>
                            <div class="flex justify-between items-center mb-3"><span class="text-xs ${statusClass}">${statusText}</span><span class="text-xs text-blue-400">${escapeHtml(m.league || 'مباراة')}</span></div>
                            <div class="flex justify-between items-center text-white font-bold text-base mb-4"><span class="w-5/12 text-center truncate">${escapeHtml(m.home_name || m.team1 || '-')}</span><span class="text-yellow-500 bg-slate-950 px-3 py-1 rounded text-sm">${escapeHtml(score)}</span><span class="w-5/12 text-center truncate">${escapeHtml(m.away_name || m.team2 || '-')}</span></div>
                        </div>
                        <button class="w-full bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white py-1.5 rounded-lg text-xs font-bold transition">فتح البث</button>
                    </div>`;
            }).join('');
        } else {
            container.innerHTML = `<div class="col-span-3 text-center text-slate-400 py-10">لا توجد مباريات متاحة.</div>`;
        }
    } catch (error) {
        container.innerHTML = `<div class="col-span-3 text-center text-red-500 py-10">فشل الاتصال بالسيرفر.</div>`;
    }
}

function openStream(url) {
    const modal = document.getElementById('stream-modal');
    const video = document.getElementById('hls-video');
    modal.classList.remove('hidden'); modal.classList.add('flex');
    if (!url) return alert('رابط البث غير متوفر');
    
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    video.pause(); video.removeAttribute('src'); video.load();

    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url; video.play().catch(()=>{});
    } else {
        alert('المتصفح لا يدعم تشغيل HLS');
    }
}

function closeStream() {
    const modal = document.getElementById('stream-modal');
    const video = document.getElementById('hls-video');
    video.pause(); video.removeAttribute('src'); video.load();
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    modal.classList.add('hidden'); modal.classList.remove('flex');
}

window.addEventListener('beforeunload', () => {
    if (currentYouTubeFile) fetch(`/api/media/${encodeURIComponent(currentYouTubeFile)}`, { method: 'DELETE', keepalive: true });
    if (currentTikTokFile) fetch(`/api/media/${encodeURIComponent(currentTikTokFile)}`, { method: 'DELETE', keepalive: true });
});
</script>
