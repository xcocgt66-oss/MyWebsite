<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-white text-slate-100 min-h-screen flex flex-col m-0 p-0 overflow-hidden" id="main-body">

    <div id="security-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl w-96 text-center">
            <div class="text-indigo-500 text-4xl mb-4"><i class="fa-solid fa-lock"></i></div>
            <h2 class="text-xl font-bold mb-2 text-white">منطقة محمية</h2>
            <p class="text-slate-400 text-sm mb-6">أدخل رمز المرور واضغط Enter</p>
            <input type="password" id="pin-input" maxlength="4" class="w-full bg-slate-800 border border-slate-700 text-center text-2xl tracking-widest rounded-xl py-3 mb-4 text-white focus:outline-none focus:border-indigo-500" placeholder="••••" onkeypress="handlePinKey(event)">
            <p id="error-msg" class="text-rose-500 text-xs mb-4 hidden">رمز المرور غير صحيح!</p>
            <button onclick="verifyPin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all">دخول</button>
        </div>
    </div>

    <div id="esc-screen" class="fixed inset-0 bg-white z-[99999] hidden"></div>

    <div id="app-container" class="flex-1 flex hidden w-full h-screen bg-slate-900">
        <aside class="w-64 bg-slate-950 border-l border-slate-800 flex flex-col justify-between p-4">
            <div>
                <div class="flex items-center justify-between mb-8 px-2">
                    <h1 class="text-xl font-black text-indigo-400">Escapped</h1>
                    <span class="flex h-3 w-3 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                </div>
                <nav class="space-y-2">
                    <button onclick="switchTab('youtube')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium bg-slate-800 text-white"><i class="fa-brands fa-youtube text-rose-500"></i> يوتيوب</button>
                    <button onclick="switchTab('chat')" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-comments text-amber-500"></i> الشات</span>
                    </button>
                </nav>
            </div>
            
            <div class="border-t border-slate-800/60 pt-4 space-y-3">
                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                    <span>المستخدم:</span>
                    <button onclick="changeUsername()" id="current-username-display" class="text-indigo-400 font-bold hover:underline">User_YHCW</button>
                </div>
                <div class="text-xs text-slate-500 text-center bg-slate-900 py-2 rounded-lg border border-slate-800">
                    المتصلين الآن (<span id="online-count-display">0</span>)
                </div>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div id="tab-youtube" class="tab-content">
                <h2 class="text-2xl font-bold mb-6 text-white">مشغل يوتيوب (عبر الـ API المتعدد)</h2>
                <div class="mb-6 flex gap-2">
                    <input type="text" id="yt-link-input" placeholder="أدخل معرف أو رابط يوتيوب..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="streamYoutubeVideoViaAPI()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium">تشغيل</button>
                </div>
                <div id="youtube-feed" class="grid grid-cols-1 gap-6">
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-slate-500">أدخل الرابط بالأعلى لبدء البث بأعلى جودة.</div>
                </div>
            </div>

            <div id="tab-chat" class="tab-content hidden h-[calc(100vh-8rem)] flex flex-col bg-slate-950 rounded-2xl border border-slate-800">
                <div class="p-4 border-b border-slate-800 font-bold flex justify-between items-center text-white">
                    <span>غرفة المحادثة المباشرة (محفوظة 24 ساعة)</span>
                    <span class="text-xs text-emerald-400">متصل</span>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                <div class="p-4 border-t border-slate-800 flex gap-2">
                    <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatKeyPress(event)">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium transition-all">إرسال</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let aPressCount = 0;
        let isEscActive = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                isEscActive = !isEscActive;
                const escScreen = document.getElementById('esc-screen');
                if (isEscActive) {
                    escScreen.classList.remove('hidden');
                    const activePlayer = document.querySelector('#youtube-feed iframe');
                    if (activePlayer) {
                        activePlayer.dataset.src = activePlayer.src;
                        activePlayer.src = '';
                    }
                } else {
                    escScreen.classList.add('hidden');
                    const activePlayer = document.querySelector('#youtube-feed iframe');
                    if (activePlayer && activePlayer.dataset.src) {
                        activePlayer.src = activePlayer.dataset.src;
                    }
                }
                return;
            }

            if (e.key.toLowerCase() === 'a') {
                aPressCount++;
                if (aPressCount >= 5) {
                    aPressCount = 0;
                    document.getElementById('security-screen').classList.remove('hidden');
                    document.getElementById('pin-input').focus();
                }
            } else {
                aPressCount = 0;
            }
        });

        function verifyPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === atob('MTAxMA==')) {
                document.getElementById('security-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('main-body').style.backgroundColor = '#0f172a';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function handlePinKey(e) {
            if (e.key === 'Enter') verifyPin();
        }

        const socket = io();
        let username = localStorage.getItem('escapped_username') || 'User_YHCW';
        document.getElementById('current-username-display').innerText = username;

        function changeUsername() {
            const newName = prompt("تغيير اسم المستخدم:", username);
            if (newName && newName.trim()) {
                username = newName.trim();
                localStorage.setItem('escapped_username', username);
                document.getElementById('current-username-display').innerText = username;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-slate-800', 'text-white'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('bg-slate-800', 'text-white');
            }
        }

        function streamYoutubeVideoViaAPI() {
            const input = document.getElementById('yt-link-input');
            const url = input.value.trim();
            if(!url) return;

            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            } else {
                videoId = url;
            }

            const apiEndpoints = [
                `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&vq=hd1080`,
                `https://www.youtube.com/embed/${videoId}?autoplay=1&vq=hd1080`,
                `https://www.youtube.com/embed/${videoId}?autoplay=1`
            ];

            let currentApiIndex = 0;
            const container = document.getElementById('youtube-feed');

            function tryNextApi() {
                if (currentApiIndex >= apiEndpoints.length) {
                    container.innerHTML = `<div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-rose-500">عذراً، فشلت جميع الـ APIs في تشغيل هذا الفيديو. حاول بتعليق رابط مختلف.</div>`;
                    return;
                }

                const currentUrl = apiEndpoints[currentApiIndex];
                currentApiIndex++;

                container.innerHTML = `
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col items-center gap-3">
                        <p class="text-xs text-emerald-400">جاري الاتصال بأفضل سيرفر بث متاح (API ${currentApiIndex})...</p>
                        <div class="aspect-video w-full rounded-xl overflow-hidden shadow-lg bg-black">
                            <iframe class="w-full h-full" src="${currentUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen onerror="tryNextApi()"></iframe>
                        </div>
                    </div>
                `;
            }

            tryNextApi();
            input.value = '';
        }

        socket.on('online-count', (count) => {
            const el = document.getElementById('online-count-display');
            if (el) el.innerText = count;
        });

        socket.on('chat-history', (history) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            history.forEach(data => appendMessage(data.user, data.text));
        });

        socket.on('chat-message', (data) => {
            appendMessage(data.user, data.text);
        });

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            socket.emit('chat-message', { user: username, text: text });
            input.value = '';
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function appendMessage(user, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = "bg-slate-900 p-3 rounded-xl border border-slate-800/60";
            div.innerHTML = `<span class="text-indigo-400 font-bold text-sm ml-2">${user}:</span><span class="text-slate-200 text-sm">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
