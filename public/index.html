<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct API Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col m-0 p-0 overflow-hidden" id="main-body">

    <div id="esc-screen" class="fixed inset-0 bg-white z-[99999] hidden"></div>

    <div id="app-container" class="flex-1 flex w-full h-screen bg-slate-900">
        <aside class="w-64 bg-slate-950 border-l border-slate-800 flex flex-col justify-between p-4">
            <div>
                <div class="flex items-center justify-between mb-8 px-2">
                    <h1 class="text-xl font-black text-indigo-400">Escapped</h1>
                    <span class="flex h-3 w-3 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                </div>
                <nav class="space-y-2">
                    <button onclick="switchTab('youtube')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium bg-slate-800 text-white"><i class="fa-solid fa-play text-rose-500"></i> المشغل المباشر</button>
                    <button onclick="switchTab('chat')" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 transition-all font-medium">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-comments text-amber-500"></i> الشات</span>
                    </button>
                </nav>
            </div>
            
            <div class="border-t border-slate-800/60 pt-4 space-y-3">
                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                    <span>المستخدم:</span>
                    <button onclick="changeUsername()" id="current-username-display" class="text-indigo-400 font-bold hover:underline">User_YHCW</button>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div id="tab-youtube" class="tab-content">
                <h2 class="text-2xl font-bold mb-6 text-white text-center">المشغل المباشر (Direct API Server)</h2>
                <div class="mb-6 flex flex-col sm:flex-row gap-2 max-w-3xl mx-auto">
                    <input type="text" id="yt-link-input" placeholder="أدخل رابط الميديا (يوتيوب وغيرها)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                    
                    <select id="yt-quality-select" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 cursor-pointer text-sm font-medium">
                        <option value="360">360p</option>
                        <option value="480" selected>480p (افتراضي)</option>
                        <option value="720">720p (HD)</option>
                        <option value="1080">1080p (FHD)</option>
                    </select>

                    <button onclick="fetchAndPlayMedia()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium">سحب وتشغيل</button>
                </div>
                <div id="media-feed" class="w-full flex justify-center">
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-slate-500 max-w-3xl w-full">أدخل الرابط لسحب الملف المباشر من السيرفر الخاص بك.</div>
                </div>
            </div>

            <div id="tab-chat" class="tab-content hidden h-[calc(100vh-8rem)] flex flex-col bg-slate-950 rounded-2xl border border-slate-800">
                <div class="p-4 border-b border-slate-800 font-bold flex justify-between items-center text-white">
                    <span>غرفة المحادثة المباشرة</span>
                    <span class="text-xs text-emerald-400">متصل</span>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                <div class="p-4 border-t border-slate-800 flex gap-2">
                    <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatKeyPress(event)">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-white font-medium transition-all">إرسال</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let isEscActive = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                isEscActive = !isEscActive;
                const escScreen = document.getElementById('esc-screen');
                const videoPlayer = document.getElementById('native-video-player');
                
                if (isEscActive) {
                    escScreen.classList.remove('hidden');
                    if (videoPlayer) videoPlayer.pause();
                } else {
                    escScreen.classList.add('hidden');
                }
            }
        });

        const socket = io();
        let username = localStorage.getItem('escapped_username') || 'User_YHCW';
        document.getElementById('current-username-display').innerText = username;

        function changeUsername() {
            const newName = prompt("تغيير اسم المستخدم:", username);
            if (newName && newName.trim()) {
                username = newName.trim();
                localStorage.setItem('escapped_username', username);
                document.getElementById('current-username-display').innerText = username;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-slate-800', 'text-white'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('bg-slate-800', 'text-white');
            }
        }

        async function fetchAndPlayMedia() {
            const input = document.getElementById('yt-link-input');
            const qualitySelect = document.getElementById('yt-quality-select');
            
            const url = input.value.trim();
            const quality = qualitySelect.value;
            if(!url) return;

            const container = document.getElementById('media-feed');
            container.innerHTML = `<div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-indigo-400 max-w-3xl w-full"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>جاري الاتصال بالسيرفر وسحب الرابط المباشر بجودة (${quality}p)...</div>`;

            try {
                const response = await fetch('/api/youtube', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url, quality: quality })
                });

                const data = await response.json();

                if (data.success && data.url) {
                    const proxyUrl = `/api/stream?url=${encodeURIComponent(data.url)}`;
                    
                    container.innerHTML = `
                        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col items-center gap-3 max-w-3xl w-full shadow-2xl">
                            <div class="w-full flex justify-between items-center px-2">
                                <h3 class="text-white font-bold text-sm truncate pr-4">${data.title}</h3>
                                <span class="text-xs text-emerald-400 whitespace-nowrap"><i class="fa-solid fa-server"></i> بث عبر السيرفر (${quality}p)</span>
                            </div>
                            <div class="aspect-video w-full rounded-xl overflow-hidden bg-black border border-slate-800 relative">
                                <video id="native-video-player" controls autoplay playsinline referrerpolicy="no-referrer" class="w-full h-full outline-none object-contain">
                                    <source src="${proxyUrl}" type="video/mp4">
                                    متصفحك لا يدعم مشغل الفيديو المدمج.
                                </video>
                                <div id="video-error-overlay" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center text-center text-rose-400 text-sm p-4"></div>
                            </div>
                        </div>
                    `;

                    setupVideoDiagnostics();
                } else {
                    container.innerHTML = `<div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-rose-500 max-w-3xl w-full">فشل في استخراج الرابط المباشر. تأكد من صحة الرابط أو حالة الـ API.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center text-rose-500 max-w-3xl w-full">تعذر الاتصال بالسيرفر. تأكد أن سيرفر الـ Node.js يعمل.</div>`;
            }
            
            input.value = '';
        }

        function setupVideoDiagnostics() {
            const video = document.getElementById('native-video-player');
            const overlay = document.getElementById('video-error-overlay');
            if (!video || !overlay) return;

            const showOverlay = (message) => {
                overlay.innerText = message;
                overlay.classList.remove('hidden');
            };
            const hideOverlay = () => overlay.classList.add('hidden');

            // إذا لم تصل أي بيانات فعلية خلال 20 ثانية من الضغط تشغيل، اعتبرها معلّقة
            let progressTimer = setTimeout(() => {
                if (video.readyState < 2) {
                    showOverlay('البث لا يستجيب (قد يكون الرابط منتهي الصلاحية أو مخنوقاً من يوتيوب). جرّب رابطاً آخر أو أعد المحاولة.');
                }
            }, 20000);

            video.addEventListener('loadeddata', () => {
                clearTimeout(progressTimer);
                hideOverlay();
            });

            video.addEventListener('error', () => {
                clearTimeout(progressTimer);
                const err = video.error;
                let msg = 'تعذر تشغيل الفيديو.';
                if (err) {
                    const codes = {1: 'تم إلغاء التحميل', 2: 'خطأ في الشبكة أثناء التحميل', 3: 'تعذر فك ترميز الفيديو', 4: 'مصدر الفيديو غير مدعوم أو فشل السيرفر في جلبه'};
                    msg = codes[err.code] ? `تعذر تشغيل الفيديو: ${codes[err.code]}` : msg;
                }
                showOverlay(msg);
            });

            video.addEventListener('stalled', () => {
                showOverlay('توقف البث مؤقتاً... قد يكون يوتيوب يخنق سرعة الرابط.');
            });

            video.addEventListener('playing', hideOverlay);
        }

        socket.on('chat_message', (data) => {
            appendMessage(data.user, data.text);
        });

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            socket.emit('chat_message', { user: username, text: text });
            input.value = '';
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function appendMessage(user, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = "bg-slate-900 p-3 rounded-xl border border-slate-800/60 break-words";
            div.innerHTML = `<span class="text-indigo-400 font-bold text-sm ml-2">${user}:</span><span class="text-slate-200 text-sm">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
